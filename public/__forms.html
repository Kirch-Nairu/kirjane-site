<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Netlify form detection only</title></head>
<body>
<!-- This form blueprint is intentionally hidden; do NOT activate the public
contact form before the company inbox, privacy notice and handling policy are approved. -->
<form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact">
  <input name="bot-field">
  <input name="full-name">
  <input type="email" name="email">
  <input name="organization">
  <input name="inquiry-type">
  <textarea name="details"></textarea>
</form>
</body>
</html>
