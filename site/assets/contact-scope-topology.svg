<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="cscope-title cscope-desc">
  <title id="cscope-title">Kirjane Scope Topology Blueprint</title>
  <desc id="cscope-desc">Interactive scoping diagram illuminating selected software, automation, integration, and Salryn domains.</desc>
  <rect width="880" height="400" rx="12" fill="#07100C" stroke="rgba(22,123,85,0.45)" stroke-width="1.2"/>
  <path d="M 170 120 C 280 100, 350 92, 440 90 C 530 92, 600 100, 710 120" fill="none" stroke="rgba(243,245,237,0.18)" stroke-width="1.4" stroke-dasharray="5 5"/>
  <path d="M 170 120 C 220 225, 330 285, 440 295 C 550 285, 660 225, 710 120" fill="none" stroke="rgba(22,123,85,0.34)" stroke-width="1.4"/>
  <line x1="440" y1="90" x2="440" y2="295" stroke="rgba(211,246,107,0.35)" stroke-width="1.5"/>
  <circle cx="440" cy="195" r="38" fill="#0C2118" stroke="#167B55" stroke-width="1.5"/>
  <text x="440" y="191" text-anchor="middle" fill="#D3F66B" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">DISCOVERY</text>
  <text x="440" y="207" text-anchor="middle" fill="rgba(243,245,237,0.75)" font-family="Segoe UI, sans-serif" font-size="10">Verified Scope</text>
  <g class="scope-node" data-scope-node="salryn">
    <rect x="38" y="86" width="264" height="68" rx="10" fill="#0B1913" stroke="rgba(243,245,237,0.22)" stroke-width="1.4"/>
    <circle cx="60" cy="120" r="5.5" fill="#167B55" stroke="#D3F66B" stroke-width="1.4"/>
    <text x="76" y="116" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">Salryn Ecosystem</text>
    <text x="76" y="135" fill="rgba(243,245,237,0.68)" font-family="Segoe UI, sans-serif" font-size="11">Modular kernel &amp; industry capabilities</text>
  </g>
  <g class="scope-node" data-scope-node="software">
    <rect x="308" y="56" width="264" height="68" rx="10" fill="#0B1913" stroke="rgba(243,245,237,0.22)" stroke-width="1.4"/>
    <circle cx="330" cy="90" r="5.5" fill="#167B55" stroke="#D3F66B" stroke-width="1.4"/>
    <text x="346" y="86" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">Custom Software</text>
    <text x="346" y="105" fill="rgba(243,245,237,0.68)" font-family="Segoe UI, sans-serif" font-size="11">Domain rules, ledgers &amp; role authority</text>
  </g>
  <g class="scope-node" data-scope-node="automation">
    <rect x="578" y="86" width="264" height="68" rx="10" fill="#0B1913" stroke="rgba(243,245,237,0.22)" stroke-width="1.4"/>
    <circle cx="600" cy="120" r="5.5" fill="#167B55" stroke="#D3F66B" stroke-width="1.4"/>
    <text x="616" y="116" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">Process Automation</text>
    <text x="616" y="135" fill="rgba(243,245,237,0.68)" font-family="Segoe UI, sans-serif" font-size="11">Deterministic queues &amp; sign-off gates</text>
  </g>
  <g class="scope-node" data-scope-node="integration">
    <rect x="308" y="261" width="264" height="68" rx="10" fill="#0B1913" stroke="rgba(243,245,237,0.22)" stroke-width="1.4"/>
    <circle cx="330" cy="295" r="5.5" fill="#167B55" stroke="#D3F66B" stroke-width="1.4"/>
    <text x="346" y="291" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">Systems Integration &amp; Hosting</text>
    <text x="346" y="310" fill="rgba(243,245,237,0.68)" font-family="Segoe UI, sans-serif" font-size="11">Schema adapters, local custody &amp; backups</text>
  </g>
