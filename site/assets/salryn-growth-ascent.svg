      <stop offset="0%" stop-color="#103D2B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#167B55" stop-opacity="0.28"/>
    </linearGradient>
  </defs>
  <rect width="1240" height="620" fill="none"/>
  <path d="M 40 505 C 360 445, 690 295, 1200 75" fill="none" stroke="rgba(22,123,85,0.26)" stroke-width="1.15"/>
