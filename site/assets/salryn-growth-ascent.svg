  <path d="M 40 681 C 360 621, 690 471, 1200 251" fill="none" stroke="rgba(22,123,85,0.14)" stroke-width="1.15"/>
  <path d="M 40 725 C 360 665, 690 515, 1200 295" fill="none" stroke="rgba(22,123,85,0.11)" stroke-width="1.15"/>
  <path d="M 170 505 C 310 462, 360 426, 450 395 C 570 355, 645 312, 745 275 C 865 228, 955 198, 1045 168 L 1045 565 L 170 565 Z" fill="url(#ascent-area)"/>
