<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" role="img" aria-labelledby="growth-title growth-desc">
  <title id="growth-title">Salryn Business Growth Diagonal Progression</title>
  <desc id="growth-desc">Bottom-left to upper-right diagonal ascent showing capability expansion on one unified kernel without replatforming.</desc>
  <defs>
