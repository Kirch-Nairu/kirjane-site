name: S02 R8.3 offline material authoring (isolated branch only)
on:
  push:
    branches: [experiment/s02-handoff-chamber-r2-writer]
    paths:
      - 'creative/s02-r8/author_materials.py'
      - '.github/workflows/s02-r83-material-authoring.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materials:
    if: github.ref == 'refs/heads/experiment/s02-handoff-chamber-r2-writer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0 opencv-python-headless==4.11.0.86 numpy==2.2.6
      - run: python creative/s02-r8/author_materials.py
      - name: Publish only checked material files to existing isolated branch
        run: |
          set -euo pipefail
          branch=experiment/s02-handoff-chamber-r2-writer
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin "refs/heads/$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/cinematic/s02-materials
          git diff --cached --quiet && exit 0
          git commit -m "build(s02): vendor verified CC0 studio materials and photographic vista"
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s02-r83-material-receipt
          path: site/assets/cinematic/s02-materials/
