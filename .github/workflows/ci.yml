name: Website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:build
      - uses: actions/upload-artifact@v4
        with:
          name: kirjane-static-preview
          path: build/client/
          if-no-files-found: error
          retention-days: 7
