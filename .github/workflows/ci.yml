name: Website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Replace npm install with npm ci after committing the verified lockfile.
      - run: npm install --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-dependency-lock
          path: package-lock.json
          retention-days: 1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:build
