name: S02 R9 authored furniture workshop (isolated branch only)
on:
  push:
    branches: [experiment/s02-handoff-chamber-r2-writer]
    paths: ['creative/s02-r9/furniture.py','.github/workflows/s02-r9-furniture.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  furniture:
    if: github.ref == 'refs/heads/experiment/s02-handoff-chamber-r2-writer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified Blender LTS
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          VERSION=4.5.16
          ARCHIVE=blender-$VERSION-linux-x64.tar.xz
          BASE=https://download.blender.org/release/Blender4.5
          curl -fsSL --retry 3 "$BASE/$ARCHIVE" -o "$ARCHIVE"
          curl -fsSL --retry 3 "$BASE/blender-$VERSION.sha256" -o blender-checksums.txt
          grep -F "$ARCHIVE" blender-checksums.txt | sha256sum -c -
          tar -xf "$ARCHIVE"
          echo "$RUNNER_TEMP/blender-$VERSION-linux-x64" >> "$GITHUB_PATH"
      - run: blender -b -t 4 --python-exit-code 1 --python creative/s02-r9/furniture.py
      - name: Publish exact generated assets to isolated branch
        run: |
          set -euo pipefail
          branch=experiment/s02-handoff-chamber-r2-writer
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin "refs/heads/$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/cinematic/s02-furniture
          git diff --cached --quiet && exit 0
          git commit -m "build(s02): publish authored Blender studio furniture"
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s02-r9-furniture
          path: site/assets/cinematic/s02-furniture/
