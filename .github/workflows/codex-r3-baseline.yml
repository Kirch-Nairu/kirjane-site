name: Codex Creative Forge R3 - exact-SHA candidate qualification
on:
  push:
    branches:
      - experiment/codex-cinematic-overhaul-r3
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codex-r3-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install root browser tooling without dependency lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Build integrated seven-page R2 and Salryn Cinema R5 candidate
        run: python3 scripts/build_immersive_r2.py --output dist/cinema-integration
      - name: Qualify embedded R5 director math
        run: node --test creative/film/src/director/*.test.mjs scripts/codex_r3_motion.test.mjs
      - name: Verify R5 integration and original R2 accessibility
        run: |
          node scripts/qa_salryn_site_integration.mjs
          FORGE_DIST=dist/cinema-integration FORGE_EVIDENCE=dist/codex-r3-evidence/r2-regression node scripts/qa_immersive_r2.mjs
      - name: Run inherited 61-check production verification
        run: |
          python3 scripts/build.py
          python3 scripts/build.py --preview --output dist/preview
          npm test
      - name: Verify R3 chapter controls and fallback routes
        env:
          FORGE_DIST: dist/cinema-integration
        run: |
          FORGE_EVIDENCE=dist/codex-r3-evidence/focused node scripts/qa_codex_r3.mjs
          R3_ROUTES_ONLY=1 FORGE_EVIDENCE=dist/codex-r3-evidence/routes node scripts/qa_codex_r3.mjs
          node scripts/codex_r3_adversarial.mjs
      - name: Generate 10 owner-target, 5 mobile and 5 R5 film captures
        run: |
          CODEX_R3_DIST=dist/cinema-integration \
          CODEX_R3_SHOTS=dist/codex-r3-evidence/candidate \
          node scripts/codex_r3_capture.mjs
      - name: Upload exact-SHA candidate visual captures and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-r3-candidate-captures
          path: |
            dist/codex-r3-evidence/
            dist/cinema-integration-evidence/
            dist/evidence/
          retention-days: 14
          if-no-files-found: warn
