name: S02 Handoff Chamber visual proof (no deploy)
on:
  push:
    branches: [experiment/s02-ps2-handoff-overdrive-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --check site/js/forge-handoff-chamber.js
      - run: python scripts/build.py --preview --output dist/s02-preview
      - name: Capture actual browser forward and reverse states
        run: |
          python -m http.server 8723 --bind 127.0.0.1 --directory dist/s02-preview > /tmp/s02-http.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER"' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8723/ >/dev/null && break; sleep 1; done
          node scripts/qa_s02_handoff_chamber.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s02-chamber-browser-evidence
          path: dist/s02-chamber-evidence/
          if-no-files-found: warn
