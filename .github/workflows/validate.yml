name: Frontend validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Verify six pre-rendered HTML routes
        run: npm run verify:routes
