name: Frontend validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      # Initial repository bootstrap lacks a lockfile.
      # Replace with npm ci after Kurt commits package-lock.json.
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Verify six pre-rendered HTML routes
        run: npm run verify:routes
