name: Frontend validation
on:
  pull_request:
    branches: [main, "feat/m01-frontend-foundation-home", "feat/m04-supporting-pages-r1", "feat/m05-editorial-visual-polish-r1", "feat/m06-home-visual-r2"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      # Initial repository bootstrap lacks a lockfile.
      # Replace with npm ci after Kurt commits package-lock.json.
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Verify six pre-rendered HTML routes
        run: npm run verify:routes
      - name: Package source snapshot
        run: |
          git archive --format=zip --output=kirjane-source.zip HEAD
      - name: Upload source ZIP for review
        uses: actions/upload-artifact@v4
        with:
          name: kirjane-mobile-r3-source
          path: kirjane-source.zip
          retention-days: 14
          if-no-files-found: error
